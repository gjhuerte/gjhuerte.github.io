    <!-- Background decorative elements -->

    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-teal-500/5 rounded-full blur-[100px] pointer-events-none">

    <div class="max-w-3xl mx-auto relative z-10" x-data="{ show: false }" x-init="setTimeout(() => show = true, 100)">
        <!-- Modern Card Container -->
        <div x-show="show" x-transition.opacity.duration.700ms.translate.y.20px
            class="bg-white/80 backdrop-blur-xl rounded-[2.5rem] shadow-2xl shadow-blue-900/5 border border-white/50 overflow-hidden">
            <!-- Header -->
            <div class="p-8 sm:p-10 border-b border-gray-100 bg-white/50 flex items-center justify-between">
                <div class="flex items-center gap-5">
                    <a href="/scheduleit" class="group relative">
                        <div
                            class="absolute -inset-2 bg-gradient-to-r from-blue-500 to-teal-400 rounded-full blur opacity-0 group-hover:opacity-40 transition duration-500">

                            class="relative w-14 h-14 object-contain">
                    </a>
                    <div>
                        <h4 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-gray-900">ScheduleIt</h4>

                    </div>
                </div>
                <a href="/projects/"
                    class="text-sm font-medium text-blue-600 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 px-5 py-2.5 rounded-full transition-colors hidden sm:block">
                    Back to Projects
                </a>
            </div>

            <!-- Main Content -->
            <div class="p-8 sm:p-10">
                <div class="prose prose-slate max-w-none">
    <p class="text-xl text-gray-500 font-light leading-relaxed mb-8">
        Your very own schedule, routines, and to-dos app.
    </p>

    <div class="mb-12">

        </a>
    </div>

    <!-- Screenshots Grid -->
    <div class="mb-12">
        <h3 class="text-lg font-bold text-gray-900 mb-6">Screenshots</h3>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
            <div class="group relative aspect-[9/19] rounded-2xl overflow-hidden shadow-lg border border-gray-100 bg-gray-50">

            <div class="group relative aspect-[9/19] rounded-2xl overflow-hidden shadow-lg border border-gray-100 bg-gray-50">

            </div>
            <div class="group relative aspect-[9/19] rounded-2xl overflow-hidden shadow-lg border border-gray-100 bg-gray-50">
                <img src="/images/scheduleit/screenshots/6.png" class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" alt="Screenshot 6" />
            </div>
        </div>
    </div>

        <p class="text-gray-500 mb-6">You can also reach us through the links below.</p>
        <div class="flex items-center gap-4">
            <a href="https://www.facebook.com/people/Scheduleit/100088685963793/" target="_blank" class="transition-transform hover:-translate-y-1 hover:shadow-lg rounded-xl overflow-hidden block">
                <img src="/images/scheduleit/facebook.jpg" class="h-10 w-10 object-cover" alt="Facebook" />

            <a href="https://www.youtube.com/channel/UC6epsgZcRzzSQsNekwdGATA" target="_blank" class="transition-transform hover:-translate-y-1 hover:shadow-lg rounded-xl overflow-hidden block">

        </div>

    <!-- Footer Links -->
    <div class="mt-12 flex flex-wrap gap-4 text-sm font-medium">
