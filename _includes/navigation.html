<div class="fixed top-0 inset-x-0 z-50 flex justify-center mt-6 px-4" x-data="{ open: false }">
    <nav class="w-full max-w-3xl bg-white/70 backdrop-blur-xl border border-gray-200 shadow-sm rounded-full px-6 py-3 flex items-center justify-between">
        
        <!-- Logo / Name -->
        <a href="/" class="text-gray-900 font-bold text-lg tracking-tight flex items-center gap-2">
            <span class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-teal-400 text-white flex items-center justify-center text-sm font-black shadow-md">GJ</span>
            <span>Gabriel</span>
        </a>

        <!-- Desktop Links -->
        <div class="hidden md:flex items-center space-x-1">
            <a href="/#about-section" class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100/50 rounded-full transition-all">About</a>
            <a href="/projects/" class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100/50 rounded-full transition-all">Projects</a>
            <a href="/#technologies-used-section" class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100/50 rounded-full transition-all">Technologies</a>
        </div>

        <!-- CTA -->
        <div class="hidden md:block">
            <a href="#footer" class="inline-flex items-center justify-center px-5 py-2 text-sm font-semibold text-white bg-gray-900 hover:bg-gray-800 rounded-full shadow-sm hover:shadow-md transition-all focus:ring-2 focus:ring-gray-900 focus:ring-offset-2">
                Hire Me
            </a>
        </div>

        <!-- Mobile Menu Button -->
        <button @click="open = !open" class="md:hidden p-2 text-gray-600 hover:text-gray-900 focus:outline-none rounded-full hover:bg-gray-100 transition-colors">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path x-show="!open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                <path x-show="open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" style="display: none;" />
            </svg>
        </button>
    </nav>

    <!-- Mobile Menu Dropdown -->
    <div x-show="open" 
         @click.away="open = false"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-2 scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 -translate-y-2 scale-95"
         style="display: none;"
         class="absolute top-20 w-full max-w-sm bg-white/90 backdrop-blur-xl border border-gray-200 shadow-xl rounded-3xl p-4 flex flex-col space-y-2 md:hidden">
        <a @click="open = false" href="/#about-section" class="px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-xl transition-colors">About</a>
        <a @click="open = false" href="/projects/" class="px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-xl transition-colors">Projects</a>
        <a @click="open = false" href="/#technologies-used-section" class="px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-xl transition-colors">Technologies</a>
        <a @click="open = false" href="#footer" class="px-4 py-3 text-sm font-bold text-center text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition-colors mt-2">Hire Me</a>
    </div>
</div>
