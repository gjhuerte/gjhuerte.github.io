<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/images/scheduleit/logo.png">
    <title>{{ page.title }}</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/css/main.css">

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    {% include google_tag_manager_script.html %}
</head>

<body class="bg-gradient-to-br from-slate-50 via-indigo-50/50 to-blue-50/50 text-slate-800 font-sans antialiased selection:bg-indigo-200 selection:text-indigo-900 min-h-screen py-12 px-4 sm:px-6 lg:px-8 relative overflow-x-hidden">
        
    <!-- Background decorative elements -->
    <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-blue-100/30 to-transparent pointer-events-none"></div>
    <div class="absolute top-[10%] left-[-10%] w-96 h-96 bg-blue-400/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-indigo-400/20 rounded-full blur-[120px] pointer-events-none"></div>

    {% include google_tag_manager_noscript.html %}
    
    <div class="max-w-4xl mx-auto relative z-10" x-data="{ show: false }" x-init="setTimeout(() => show = true, 100)">
        
        <!-- Modern Card Container -->
        <div x-show="show" x-transition.opacity.duration.700ms.translate.y.20px class="bg-white/90 backdrop-blur-2xl rounded-[2.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/80 overflow-hidden relative">
            
            <!-- Top Gradient Bar -->
            <div class="h-1.5 w-full bg-gradient-to-r from-blue-500 via-indigo-500 to-teal-400"></div>

            <!-- Header -->
            <div class="p-8 sm:p-10 border-b border-slate-100/60 bg-white/40 flex flex-col sm:flex-row items-center sm:items-start justify-between gap-6">
                <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 text-center sm:text-left">
                    <a href="/scheduleit" class="group relative inline-block">
                        <div class="absolute -inset-3 bg-gradient-to-r from-blue-400 to-indigo-400 rounded-full blur-md opacity-20 group-hover:opacity-60 transition duration-500"></div>
                        <img src="/images/scheduleit/logo_nb.png" alt="ScheduleIt Logo" class="relative w-16 h-16 object-contain transform group-hover:scale-105 transition duration-500">
                    </a>
                    <div class="mt-2 sm:mt-0 flex flex-col justify-center h-full">
                        <h4 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-700 mb-1">ScheduleIt</h4>
                        <p class="text-sm sm:text-base text-slate-500 font-medium">Your schedule, routines, and to-dos</p>
                    </div>
                </div>
                <a href="/projects/" class="text-sm font-semibold text-indigo-600 hover:text-white bg-indigo-50 hover:bg-indigo-600 px-6 py-2.5 rounded-full transition-all duration-300 shadow-sm hover:shadow-indigo-500/30 w-full sm:w-auto text-center mt-2 sm:mt-0">
                    &larr; Back to Projects
                </a>
            </div>
            
            <!-- Main Content -->
            <div class="p-8 sm:p-12">
                {{ content }}
            </div>
        </div>
    </div>
</body>

</html>
