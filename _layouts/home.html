<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="f1kX8seHFam2JHDrmTEB8HD5FKW6cTIVw6ySmdnP" />
    <link rel="icon" type="image/x-icon" href="/images/vector-image.jpg">
    <title>{{ page.title }}</title>
    <link href="https://gjhuerte.github.io/css/app.css" rel="stylesheet" />
    <link href="/css/main.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script type="text/javascript" src="https://gjhuerte.github.io/js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    {% include google_tag_manager_script.html %}
</head>

<body x-data="{ loaded: false }"
    x-init="window.addEventListener('load', () => { setTimeout(() => loaded = true, 300) })"
    class="bg-gray-50 text-gray-900 font-sans antialiased font-['Inter']">
    <!-- Preloader -->
    <div x-show="!loaded" x-transition.opacity.duration.500ms
        class="fixed inset-0 z-[9999] flex items-center justify-center bg-white">
        <div class="w-16 h-16 border-4 border-blue-500 border-dashed rounded-full animate-spin"></div>
    </div>
    {% include google_tag_manager_noscript.html %}
    {% include navigation.html %}
    {% include header.html %}

    {{ content }}

    {% include footer.html %}
</body>

</html>
